name: Maven CI/CD with SonarQube — Build, Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  WORKFLOW_VAR: "This is a workflow-level variable"
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:

  # ===================== BUILD & SONARQUBE ANALYSIS =====================
  build:
    name: Build & Analyze with SonarQube
    runs-on: ubuntu-latest

    env:
      JOB_VAR: "This is a job-level variable for 'build'"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required for better relevancy in Sonar analysis

      - name: Display Workflow & Runner Contexts
        run: |
          echo "Triggered by: ${{ github.actor }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Workflow var: $WORKFLOW_VAR"
          echo "Job var: $JOB_VAR"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # --- Optional but recommended caching for SonarQube ---
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # --- Build and run Sonar analysis together ---
      - name: Build and Analyze
        env:
          MAVEN_OPTS: "-DskipTests"
        run: |
          echo "Building project with SonarQube analysis..."
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=sample-project \
            -Dsonar.projectName='sample-project'

      - name: Report Job Status
        if: always()
        run: echo "Build job status: ${{ job.status }}"

  # ===================== TEST JOB =====================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    env:
      TEST_SCOPE: "UnitTests"
    if: success() && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests
        run: |
          echo "Running tests with scope: $TEST_SCOPE"
          mvn -B test

      - name: Report Job Status
        if: always()
        run: echo "Test job status: ${{ job.status }}"

  # ===================== FAILURE NOTIFICATION JOB =====================
  send_failure_notification:
    name: Failure Notification
    needs: [build, test]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Notify on Failure
        run: echo "🔴 ALERT! Workflow failed in build or test stage. Please investigate."

  # ===================== DEPLOY JOB =====================
  deploy:
    name: Deploy to GitHub Packages
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display Dependency Job Status
        run: |
          echo "Build job result: ${{ needs.build.result }}"
          echo "Test job result: ${{ needs.test.result }}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Create settings.xml with credentials
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy package
        run: mvn -B deploy --settings ~/.m2/settings.xml

      - name: Report Job Status
        if: always()
        run: echo "Deploy job status: ${{ job.status }}"
